# Based on: https://github.com/docker/mcp-gateway/tree/main/examples/container
services:
    mcpgateway:
        image: docker/mcp-gateway
        ports:
            - 8811:8811
        volumes:
            - $HOME/.docker/mcp:/mcp
        restart: always
        command: --catalog=/mcp/catalogs/docker-mcp.yaml \
            --config=/mcp/config.yaml \
            --registry=/mcp/registry.yaml \
            --tools-config=/mcp/tools.yaml \
            --secrets=docker-desktop \
            --watch=true \
            --transport=sse \
            --port=8811

