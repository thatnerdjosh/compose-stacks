version: '3.8'

services:
  portainer:
    image: portainer/portainer-ce
    container_name: portainer
    restart: always
    security_opt:
      - label=disable
    ports:
      - "9443:9443"
    volumes:
      # - /run/podman/podman.sock:/var/run/docker.sock # Rootful
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock # Rootless
      - portainer_data:/data
      # - /var/lib/containers/storage/volumes:/var/lib/docker/volumes

volumes:
  portainer_data:
